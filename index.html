<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-ag-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הספרייה של מיקה ונרקיס</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div id="splash-screen">
        <h1>הספרייה של מיקה ונרקיס</h1>
    </div>

    <div id="app" class="hidden">
        <header>
            <h1>יצירת ספר חדש</h1>
        </header>

        <main>
            <div id="book-creation-step" class="step">
                <h2>שלב 1: הגדרות הספר</h2>
                <form id="book-form">
                    <div class="form-group">
                        <label for="page-count">כמה עמודים תרצו בספר?</label>
                        <input type="number" id="page-count" name="page-count" min="1" value="10">
                    </div>
                    <div class="form-group">
                        <label for="story-prompt">על מה יהיה הסיפור?</label>
                        <textarea id="story-prompt" name="story-prompt" rows="4"></textarea>
                    </div>
                    <button type="submit">צור סיפור</button>
                </form>
            </div>

            <div id="page-view-step" class="step hidden">
                <div id="page-container">
                    <!-- Pages will be generated here -->
                </div>
                <div id="page-navigation">
                    <button id="prev-page">הקודם</button>
                    <button id="swap-sides">החלף צדדים</button>
                    <span id="page-indicator">עמוד 1</span>
                    <button id="next-page">הבא</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
